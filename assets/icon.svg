<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececf0"/>
    </linearGradient>
  </defs>
  <!-- Background following Apple's icon grid: 824 px with a 100 px margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- The mark itself; the app draws exactly this group as the logo in the toolbar
       (src/logo.rs) and tints it in the theme's colour there -->
  <g id="logo" fill="none" stroke="#111111" stroke-width="26">
    <!-- Circle in the centre -->
    <circle cx="512" cy="512" r="172" stroke-width="32"/>
    <!-- M -->
    <path d="M436 590 V434 L512 524 L588 434 V590" stroke-width="32"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Branches with nodes -->
    <g stroke-linecap="round">
      <path d="M390 390 L272 272"/>
      <path d="M634 390 L752 272"/>
      <path d="M390 634 L272 752"/>
      <path d="M634 634 L752 752"/>
      <path d="M512 684 V786"/>
    </g>
    <g fill="#111111" stroke="none">
      <circle cx="268" cy="268" r="30"/>
      <circle cx="756" cy="268" r="30"/>
      <circle cx="268" cy="756" r="30"/>
      <circle cx="756" cy="756" r="30"/>
      <circle cx="512" cy="790" r="30"/>
    </g>
    <!-- Square brackets left and right -->
    <path d="M302 386 H232 V638 H302" stroke-linejoin="miter"/>
    <path d="M722 386 H792 V638 H722" stroke-linejoin="miter"/>
  </g>
</svg>
