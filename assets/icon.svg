<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececf0"/>
    </linearGradient>
  </defs>
  <!-- Fläche nach Apples Icon-Raster: 824 px mit 100 px Rand -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- Das Zeichen selbst; die App zeichnet genau diese Gruppe als Logo in der Werkzeugleiste
       (src/logo.rs) und färbt sie dort in der Farbe des Themes -->
  <g id="logo" fill="none" stroke="#111111" stroke-width="26">
    <!-- Kreis in der Mitte -->
    <circle cx="512" cy="512" r="172" stroke-width="32"/>
    <!-- M -->
    <path d="M436 590 V434 L512 524 L588 434 V590" stroke-width="32"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Zweige mit Knoten -->
    <g stroke-linecap="round">
      <path d="M390 390 L272 272"/>
      <path d="M634 390 L752 272"/>
      <path d="M390 634 L272 752"/>
      <path d="M634 634 L752 752"/>
      <path d="M512 684 V786"/>
    </g>
    <g fill="#111111" stroke="none">
      <circle cx="268" cy="268" r="30"/>
      <circle cx="756" cy="268" r="30"/>
      <circle cx="268" cy="756" r="30"/>
      <circle cx="756" cy="756" r="30"/>
      <circle cx="512" cy="790" r="30"/>
    </g>
    <!-- Eckige Klammern links und rechts -->
    <path d="M302 386 H232 V638 H302" stroke-linejoin="miter"/>
    <path d="M722 386 H792 V638 H722" stroke-linejoin="miter"/>
  </g>
</svg>
