[package]
name = "mindful"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
rfd = "0.15"
resvg = "0.45"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
egui-phosphor = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
arboard = "3"

# Kleinere, schnellere Programmdatei für die fertige App
[profile.release]
lto = "thin"
strip = true
