[package]
name = "mindful"
version = "0.4.0"
edition = "2021"
description = "Mind maps, Markdown and presentations in one small desktop app"
license = "MIT"
repository = "https://github.com/tj537/mindful"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
rfd = "0.15"
resvg = "0.45"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
egui-phosphor = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
arboard = "3"
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Optional sound feedback: playback only, no decoders (the sounds are synthesized)
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[build-dependencies]
# App icon and version info in the Windows .exe
winresource = "0.1"

# Smaller, faster binary for the finished app
[profile.release]
lto = "thin"
strip = true
